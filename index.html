<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Student Result Management System</h1>
    <p>Enter marks, check the outcome, and review the class record.</p>
  </header>

  <main class="layout">

    <!-- Entry form -->
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Student details</h2>

      <form id="resultForm" novalidate>
        <div class="field">
          <label for="name">Student name</label>
          <input type="text" id="name" placeholder="e.g. Priya Sharma">
          <small class="error" id="nameError"></small>
        </div>

        <div class="field">
          <label for="roll">Roll number</label>
          <input type="text" id="roll" placeholder="e.g. 25CS001">
          <small class="error" id="rollError"></small>
        </div>

        <fieldset class="marks">
          <legend>Subject marks (out of 100)</legend>

          <div class="field">
            <label for="math">Mathematics</label>
            <input type="number" id="math" min="0" max="100" step="1">
            <small class="error" id="mathError"></small>
          </div>

          <div class="field">
            <label for="science">Science</label>
            <input type="number" id="science" min="0" max="100" step="1">
            <small class="error" id="scienceError"></small>
          </div>

          <div class="field">
            <label for="english">English</label>
            <input type="number" id="english" min="0" max="100" step="1">
            <small class="error" id="englishError"></small>
          </div>

          <div class="field">
            <label for="programming">Programming</label>
            <input type="number" id="programming" min="0" max="100" step="1">
            <small class="error" id="programmingError"></small>
          </div>

          <div class="field">
            <label for="web">Web Development</label>
            <input type="number" id="web" min="0" max="100" step="1">
            <small class="error" id="webError"></small>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn primary">Add result</button>
          <button type="button" class="btn ghost" id="clearBtn">Clear form</button>
        </div>

        <p class="form-message" id="formMessage" role="status"></p>
      </form>
    </section>

    <!-- Results table -->
    <section class="panel" aria-labelledby="table-title">
      <div class="table-head">
        <h2 id="table-title">Class results</h2>
        <span class="count" id="resultCount">0 students</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Roll</th>
              <th scope="col">Total</th>
              <th scope="col">%</th>
              <th scope="col">Grade</th>
              <th scope="col">Status</th>
              <th scope="col"><span class="visually-hidden">Remove</span></th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr class="empty-row">
              <td colspan="7">No results yet. Add a student to begin.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
